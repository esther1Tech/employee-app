version: 2.1

orbs:
  aws-cli: circleci/aws-cli@4.1
  python: circleci/python@2.1

# ── Reusable commands ──────────────────────────────────────────────────────────
commands:
  ecr-login:
    steps:
      - run:
          name: Authenticate Docker to ECR
          command: |
            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

# ── Jobs ───────────────────────────────────────────────────────────────────────
jobs:

  # ── Job 1: Test ───────────────────────────────────────────────────────────────
  test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: pip
          pip-dependency-file: backend/requirements.txt
      - run:
          name: Run pytest
          command: |
            cd backend
            DATABASE_URL=sqlite:///test.db \
            AWS_REGION=us-east-1 \
            pytest -v

  # ── Job 2: Build & Push ───────────────────────────────────────────────────────
  build-and-push:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - aws-cli/setup:
          aws_access_key_id: AWS_ACCESS_KEY_ID
          aws_secret_access_key: AWS_SECRET_ACCESS_KEY
          region: AWS_REGION
      - ecr-login
      - run:
          name: Set image tags
          command: |
            TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
            if [ "$CIRCLE_BRANCH" = "main" ]; then
              echo "export BACKEND_TAG=be-prod-${TIMESTAMP}" >> $BASH_ENV
              echo "export FRONTEND_TAG=fe-prod-${TIMESTAMP}" >> $BASH_ENV
            else
              echo "export BACKEND_TAG=be-dev-${TIMESTAMP}" >> $BASH_ENV
              echo "export FRONTEND_TAG=fe-dev-${TIMESTAMP}" >> $BASH_ENV
            fi
      - run:
          name: Build and push backend
          command: |
            docker build -t $ECR_REGISTRY/employee-backend:$BACKEND_TAG backend/
            docker push $ECR_REGISTRY/employee-backend:$BACKEND_TAG
      - run:
          name: Build and push frontend
          command: |
            docker build -t $ECR_REGISTRY/employee-frontend:$FRONTEND_TAG frontend/
            docker push $ECR_REGISTRY/employee-frontend:$FRONTEND_TAG
      - run:
          name: Save tags for deploy job
          command: |
            echo $BACKEND_TAG > /tmp/backend_tag
            echo $FRONTEND_TAG > /tmp/frontend_tag
      - persist_to_workspace:
          root: /tmp
          paths:
            - backend_tag
            - frontend_tag

  # ── Job 3: Deploy to EC2 ──────────────────────────────────────────────────────
  deploy:
    docker:
      - image: cimg/base:current
    steps:
      - attach_workspace:
          at: /tmp
      - run:
          name: Load tags
          command: |
            echo "export BACKEND_TAG=$(cat /tmp/backend_tag)" >> $BASH_ENV
            echo "export FRONTEND_TAG=$(cat /tmp/frontend_tag)" >> $BASH_ENV
      - run:
          name: Deploy to EC2
          command: |
            echo "Deploying to $EC2_USER@$EC2_HOST"
            echo "EC2_USER is: ${EC2_USER}"
            echo "EC2_HOST is: ${EC2_HOST}"

            # Write SSH key from environment variable
            mkdir -p ~/.ssh
            printf "%b" "$EC2_SSH_KEY" > ~/.ssh/deploy_key.pem
            chmod 600 ~/.ssh/deploy_key.pem

            TARGET_USER="${EC2_USER:-ec2-user}"
            TARGET_HOST="${EC2_HOST}"

            cat > /tmp/deploy.sh \<<SCRIPT
            aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}
            docker network inspect employee-network >/dev/null 2>&1 || docker network create employee-network
            if ! docker ps --format '{{.Names}}' | grep -q '^db$'; then
              docker rm -f db || true
              docker run -d --name db --restart unless-stopped --network employee-network -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=employees -v postgres-data:/var/lib/postgresql/data postgres:15
              until docker exec db pg_isready -U postgres; do sleep 2; done
            fi
            docker pull ${ECR_REGISTRY}/employee-backend:${BACKEND_TAG}
            docker pull ${ECR_REGISTRY}/employee-frontend:${FRONTEND_TAG}
            docker rm -f backend frontend || true
            docker run -d --name backend --restart unless-stopped --network employee-network -p 5000:5000 -e DATABASE_URL=postgresql://postgres:postgres@db:5432/employees ${ECR_REGISTRY}/employee-backend:${BACKEND_TAG}
            docker run -d --name frontend --restart unless-stopped --network employee-network -p 8080:80 ${ECR_REGISTRY}/employee-frontend:${FRONTEND_TAG}
            docker image prune -f
            SCRIPT
            scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key.pem /tmp/deploy.sh ${TARGET_USER}@${TARGET_HOST}:/tmp/deploy.sh
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key.pem ${TARGET_USER}@${TARGET_HOST} "bash /tmp/deploy.sh"

# ── Workflows ──────────────────────────────────────────────────────────────────
workflows:
  build-and-deploy:
    jobs:
      - test:
          context: employee-app

      - build-and-push:
          context: employee-app
          requires:
            - test
          filters:
            branches:
              only:
                - develop
                - main

      - deploy:
          context: employee-app
          requires:
            - build-and-push
          filters:
            branches:
              only:
                - develop
                - main
