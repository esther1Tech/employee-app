name: Deploy to Development

on:
  workflow_run:
    workflows: ["Test"]
    branches: [develop]
    types: [completed]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      backend_tag: ${{ steps.tag.outputs.backend_tag }}
      frontend_tag: ${{ steps.tag.outputs.frontend_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          echo "backend_tag=be-dev-${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "frontend_tag=fe-dev-${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        run: |
          docker build -t ${{ vars.ECR_REGISTRY }}/employee-backend:${{ steps.tag.outputs.backend_tag }} backend/
          docker push ${{ vars.ECR_REGISTRY }}/employee-backend:${{ steps.tag.outputs.backend_tag }}

      - name: Build and push frontend
        run: |
          docker build -t ${{ vars.ECR_REGISTRY }}/employee-frontend:${{ steps.tag.outputs.frontend_tag }} frontend/
          docker push ${{ vars.ECR_REGISTRY }}/employee-frontend:${{ steps.tag.outputs.frontend_tag }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: development
    steps:
      - name: Deploy to dev EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            # Authenticate with ECR
            aws ecr get-login-password --region ${{ vars.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${{ vars.ECR_REGISTRY }}

            # Create network if it does not exist
            docker network inspect employee-network >/dev/null 2>&1 || \
              docker network create employee-network

            # Start postgres if not already running
            if ! docker ps --format '{{.Names}}' | grep -q '^db$'; then
              docker rm -f db || true
              docker run -d --name db --restart unless-stopped \
                --network employee-network \
                -e POSTGRES_USER=postgres \
                -e POSTGRES_PASSWORD=postgres \
                -e POSTGRES_DB=employees \
                -v postgres-data:/var/lib/postgresql/data \
                postgres:15
              until docker exec db pg_isready -U postgres; do sleep 2; done
            fi

            # Pull latest images
            docker pull ${{ vars.ECR_REGISTRY }}/employee-backend:${{ needs.build-and-push.outputs.backend_tag }}
            docker pull ${{ vars.ECR_REGISTRY }}/employee-frontend:${{ needs.build-and-push.outputs.frontend_tag }}

            # Replace old containers
            docker rm -f backend frontend || true

            docker run -d --name backend --restart unless-stopped \
              --network employee-network \
              -p 5000:5000 \
              -e DATABASE_URL=postgresql://postgres:postgres@db:5432/employees \
              ${{ vars.ECR_REGISTRY }}/employee-backend:${{ needs.build-and-push.outputs.backend_tag }}

            docker run -d --name frontend --restart unless-stopped \
              --network employee-network \
              -p 8080:80 \
              ${{ vars.ECR_REGISTRY }}/employee-frontend:${{ needs.build-and-push.outputs.frontend_tag }}

            # Remove dangling and old images to free disk space
            docker image prune -f
            docker images ${{ vars.ECR_REGISTRY }}/employee-backend --format '{{.ID}} {{.Tag}}' | \
              grep -v '${{ needs.build-and-push.outputs.backend_tag }}' | awk '{print $1}' | xargs -r docker rmi -f || true
            docker images ${{ vars.ECR_REGISTRY }}/employee-frontend --format '{{.ID}} {{.Tag}}' | \
              grep -v '${{ needs.build-and-push.outputs.frontend_tag }}' | awk '{print $1}' | xargs -r docker rmi -f || true
